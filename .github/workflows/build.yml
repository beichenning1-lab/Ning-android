name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Debug env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME 2>/dev/null | head
          ls $ANDROID_HOME/platforms/ 2>/dev/null
          ls $ANDROID_HOME/build-tools/ 2>/dev/null

      - name: Install SDK 34
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          else
            SDKMGR=$(which sdkmanager || echo "")
          fi
          echo "sdkmanager=$SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | $SDKMGR --licenses > /dev/null 2>&1 || true
            $SDKMGR "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -10 || true
          fi

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tail -150

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ning-APK
          path: app/build/outputs/apk/debug/*.apk
