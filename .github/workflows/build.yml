name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH
          ./gradle-8.5/bin/gradle --version

      - name: Install SDK 34
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMGR=$(which sdkmanager || echo "")
          fi
          if [ -n "$SDKMGR" ]; then
            yes | $SDKMGR --licenses > /dev/null 2>&1 || true
            $SDKMGR "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Check APK exists
        run: |
          echo "=== 检查 APK ==="
          find app/build/outputs -name "*.apk" || echo "NO APK FOUND"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "debug dir missing"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ning-APK
          path: app/build/outputs/apk/debug/*.apk
